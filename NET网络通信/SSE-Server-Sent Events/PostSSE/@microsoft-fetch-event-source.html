<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE</title>
    <style>
        h1 {
            text-align: center;
        }
    </style>

<body>
    <h1>Server-Sent Events 服务端推送！ Xcube 小T写作</h1>
    <hr />
    <h3><a href="https://aigc-center-test.netapitest.com/api/writer-v2/touch">SSE</a></h3>
    <main class="box">
        <ul id="ul">
            <li><b id="msg"></b></li>
        </ul>
    </main>
    <footer>
        <textarea id="prompt" rows="4" cols="50" placeholder="请输入提示词！"
            value="请根据素材内容，结合上下文编写一篇报告，内容详实，观点鲜明。"></textarea>
        <button id="send">发送</button>
    </footer>
    <script type="module">
        import { fetchEventSource } from './@microsoft/fetch-event-source';

        const controller = new AbortController();

        async function startStream(url, body, callback) {
            try {
                await fetchEventSource(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded', // 表单数据编码传输
                        'aigc-auth-token': "fa8d26880ec6de9d810dc13d6cc5b256",
                        'aigc-u-id': "tb+KjpouGNgwsAXnpULy6g==",
                    },
                    body,
                    signal: controller.signal,
                    openWhenHidden: true, // 页面隐藏时保持连接

                    onopen: (response) => {
                        if (!response.ok) throw new Error(`连接失败: ${response.status}`);
                    },

                    onmessage: (event) => {
                        // 解析服务端推送的数据
                        const data = JSON.parse(event.data);
                        console.log('接收片段:', data.token);
                        callback(data);
                    },

                    onclose: () => {
                        console.log('流结束');
                    },

                    onerror: (err) => {
                        console.error('流错误:', err);
                        // 关键：抛出错误以终止重试循环
                        throw err;
                    }
                });
            } catch (err) {
                if (err.name === 'AbortError') console.log('请求已取消');
                else console.error('请求失败', err);
            }
        }

        // 手动取消连接
        // controller.abort();
        // ```‌‌:ml-citation{ref="1,8" appearance="aggregated" data="citationList"}

        // ### 高级特性与注意事项
        // - &zwnj;**错误响应捕获**&zwnj;：若服务端返回非 SSE 格式（如 JSON 错误），需在 `headers` 中设置 `Accept: '*/*'` 并在 `onopen` 中手动解析 `response.json()`，否则默认只接受 `text/event-stream` 导致错误信息丢失 。
        // - &zwnj;**断线重连与 Last-Event-ID**&zwnj;：库本身不自动持久化 `last-event-id`，需手动在 `onmessage` 中记录 ID，重连时通过 `headers: { 'Last-Event-ID': savedId }` 传递以实现续传；原生不支持 pause/resume，需自行封装状态机 。
        // - &zwnj;**数据格式规范**&zwnj;：服务端必须严格遵循 SSE 格式（`data: {...}\n\n`），否则 `onmessage` 可能不触发或解析失败 。‌‌:ml-citation{ref="13,2" appearance="aggregated" data="citationList"}

        // 模型选择
        const model = "deepseek"; // qwen-plus

        // 点击发送按钮，发送提示词
        document.querySelector("#send").addEventListener("click", function () {
            const prompt = document.querySelector("#prompt").value.trim();
            startStream("https://aigc-center-test.netapitest.com/api/writer-v2/touch", {
                prompt,
                model,
                // conversation_id: 1957,
            }, (data) => {
                console.log('解析数据:', data);
            });

        });
