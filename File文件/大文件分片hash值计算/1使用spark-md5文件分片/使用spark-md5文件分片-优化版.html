<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spark-md5文件分片-优化版</title>
    <style>
        h1 {
            text-align: center;
        }

        .box {
            margin: 20px;
            font-size: 32px;
        }

        #progress {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>spark-md5文件分片-优化版（SparkMD5 增量模式）</h1>
    <hr />
    <pre>
    <b>SparkMD5增量模式：</b>
        在 JavaScript 中使用 new SparkMD5.ArrayBuffer() 开启‌增量模式‌，是处理大文件（如视频、镜像文件）进行 MD5校验的最佳实践。
        该模式通过将文件分块读取并逐块追加哈希计算，避免了将整个文件加载到内存中，从而防止浏览器崩溃或内存溢出。
    </pre>
    <div class="box">
        spark-md5文件分片-优化版：<input type="file" id="file" />
        <div id="progress"></div>
        <h3 id="chunks"></h3>
    </div>

    <!-- 引入专为前端大文件设计的 SparkMD5 -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script> -->
    <script src="./spark-md5.js"></script>
    <script type="module">
        // 引入spark-md5库
        // import { SparkMD5 } from './spark-md5.js';

        const inpfile = document.querySelector('#file');
        const progressEl = document.querySelector('#progress');

        // SparkMD5 增量模式
        const spark = new SparkMD5.ArrayBuffer();

        // 创建文件分片（通过文件分片内容计算HASH值）
        const createChunk = (file, index, chunkSize) => {
            return new Promise((resolve, reject) => {
                const start = index * chunkSize;

                // 防止最后一个分片越界
                const end = Math.min(start + chunkSize, file.size);
                const blob = file.slice(start, end);

                const fileReader = new FileReader();

                fileReader.onload = (e) => {
                    // 增量追加计算当前数据块 (e.target.result 是 ArrayBuffer)
                    spark.append(e.target.result); 
                    // 获取最终哈希值
                    const hash = spark.end();
                    resolve({
                        index,
                        start,
                        end,
                        hash,
                        blob,
                    });
                };

                fileReader.onerror = () => {
                    console.log('文件分片读取失败！');
                };

                // 切片读取文件
                fileReader.readAsArrayBuffer(blob);
            })
        };

        // 定义文件每片的分片大小 5MB
        const CHUNK_SIZE = 1024 * 1024 * 5;

        const cutFile = async (file) => {
            console.log('文件总大小：', (file.size / 1024 / 1024).toFixed(2) + 'MB');

            // 计算文件总分片数
            const chunkCount = Math.ceil(file.size / CHUNK_SIZE); // 分片向上取整，如：5.5片就要分6片
            console.log('文件总分片数：', chunkCount);

            console.log('\n文件分片中...🚀 正在串行计算MD5，请勿关闭页面！🚀如果文件是存储SSD固态硬盘中的话，读取速度会有非常大的提升哦！！\n');

            const chunks = [];
            // 获取文件分片每片的信息
            // 核心优化：采用串行计算（await 放在循环内）
            // 为什么不用 Promise.all？因为 MD5 是 CPU 密集型任务，并行计算会瞬间卡死浏览器主线程。
            // 串行计算虽然看起来是“依次等待”，但内存占用极低，且不会阻塞 UI 渲染。
            for (let i = 0; i < chunkCount; i++) {
                chunks.push(await createChunk(file, i, CHUNK_SIZE));

                // 更新进度
                progressEl.innerText = `计算进度: ${((i + 1) / chunkCount * 100).toFixed(2) }% (正在切${i + 1}个，共计${chunkCount}个文件切片)`;
            }

            return chunks;
        };

        inpfile.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            console.time('耗时');
            const chunks = await cutFile(file);
            console.timeEnd('耗时');

            // 展示结果（只显示前3个分片的hash，避免DOM渲染过多卡顿）
            document.querySelector('#chunks').innerText =
                `共 ${chunks.length} 个分片，前3个Hash: \n` +
                chunks.slice(0, 3).map(c => `分片${c.index}: ${c.hash}`).join('\n');

            console.log('完整分片结果：', chunks);
        }
    </script>
</body>

</html>
